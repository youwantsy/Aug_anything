function augHTML(){return `<div class="title-row"><div><p class="eyebrow" style="margin-bottom:12px">LOCAL IMAGE LAB</p><h1>A new perspective, by design.</h1><p>이미지를 변형하고, 재현 가능한 데이터셋으로 저장하세요.</p></div><span class="badge">ON YOUR DEVICE</span></div><div class="callout" style="margin-bottom:22px">선택한 이미지는 이 브라우저에서만 처리합니다. 결과 저장은 실제 다운로드이며, 카탈로그 등록은 세션 메모리입니다.</div><div class="aug-layout"><form id="augForm"><fieldset class="aug-lock" id="augLock" ${AUG.busy?'disabled':''}><div class="panel aug-controls"><p class="eyebrow">TRANSFORM RECIPE</p><div class="aug-fields">${augNumber('seed','Seed · 정수',0,4294967295)}${augNumber('copies','원본당 출력 수',1,5)}</div><fieldset><legend>${augCheck('jitter','Color jitter')}</legend><div class="aug-fields">${augNumber('brightness','Brightness ±',0,1,.05)}${augNumber('contrast','Contrast ±',0,1,.05)}${augNumber('saturation','Saturation ±',0,1,.05)}${augNumber('hue','Hue ± (회전 비율)',0,.5,.01)}</div><p class="aug-hint">밝기·대비·채도: 1±범위 / hue: ±범위에서 균등 추출. 순서는 아래 안내 참고.</p></fieldset><fieldset><legend>${augCheck('rotate','Rotation')}</legend><div class="aug-fields">${augNumber('degrees','각도 ± (시계방향 °)',0,180)}${augSelect('expand','캔버스',['expand','crop'].map(x=>[x,x==='expand'?'Expand · 전체 보존':'Crop · 원본 크기']))}<label>빈 영역 / 투명 입력 배경<input data-cfg="background" type="color" value="${AUG.config.background}"></label></div></fieldset><fieldset><legend>Flipping</legend><div class="aug-fields">${augCheck('hflip','좌우 · 확률 50%')}${augCheck('vflip','상하 · 확률 50%')}</div>${augCheck('gray','Grayscale · 항상 적용')}</fieldset><fieldset><legend>${augCheck('resize','Resizing')}</legend><div class="aug-fields">${augNumber('width','너비 px',16,2048)}${augNumber('height','높이 px',16,2048)}${augSelect('policy','종횡비 정책',[['fit','Fit · 여백'],['crop','Crop · 중앙 자르기'],['keep','Keep · 경계 안에 맞춤']])}</div></fieldset><fieldset><legend>Image mixing</legend><div class="aug-fields">${augSelect('mix','마지막 연산',[['none','사용 안 함'],['mixup','MixUp'],['cutmix','CutMix']])}${augNumber('lambda','λ · 원본 A 비중',0,1,.05)}</div>${augCheck('self','자기 자신을 짝 후보에 포함')}<p class="aug-hint">직접 λ 지정 방식 (Beta 추출 아님). 최소 2개 입력. 짝 B는 seed로 선택하며 최종 A 크기에 중앙 Crop 정렬합니다. CutMix는 실제 패치 면적으로 λ를 보정합니다.</p></fieldset><div class="aug-fields">${augSelect('format','출력 포맷',[['png','PNG · 무손실'],['jpeg','JPG · 품질 92%']])}</div><p class="aug-hint">모든 출력은 RGB 불투명 이미지입니다.</p></div></fieldset></form><div class="aug-work"><section class="card"><h2>01 / Source images</h2><p class="tiny muted">PNG · JPG · WebP · 정지 이미지</p><label class="aug-source-upload">이미지 선택 · 최대 24개<input id="augFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple ${AUG.busy?'disabled':''}></label><div id="augSources" class="aug-source-list"></div><div class="aug-actions"><button id="augClear" ${AUG.busy?'disabled':''}>입력·결과 비우기</button></div><p class="aug-hint">총 파일 60 MB / 디코딩 32 MP / 개별 12 MP. 분류 라벨은 선택 사항입니다. bbox·segmentation mask는 변환하지 않습니다.</p></section><section class="card" style="margin-top:20px"><h2>02 / Preview & generate</h2><p class="tiny muted">선택한 원본의 첫 출력 · 배치와 같은 seed 규칙</p><div class="aug-preview"><div><p class="eyebrow">ORIGINAL A</p><div class="aug-stage" id="augOriginal"><span>이미지를 선택하세요.</span></div></div><div><p class="eyebrow">AUGMENTED</p><div class="aug-stage" id="augAfter"><span>레시피를 설정하고 미리보기를 실행하세요.</span></div></div></div><p id="augMeta" class="aug-output-meta aug-hint"></p><div class="aug-actions"><button id="augPreview" ${AUG.busy?'disabled':''}>미리보기</button><button id="augBatch" class="primary" ${AUG.busy?'disabled':''}>전체 증강 생성</button><button id="augCancel" ${AUG.busy?'':'hidden'}>작업 취소</button></div><div id="augStatus" class="aug-status" role="status" aria-live="polite">${AUG.busy?'처리 중…':''}</div></section><section class="card" style="margin-top:20px"><h2>03 / Export</h2><p class="tiny muted">생성 시점의 이미지와 manifest를 함께 보관합니다.</p><div id="augResults" class="aug-results"></div><div class="aug-actions"><button id="augZip">전체 ZIP 저장</button><button id="augManifest">JSON manifest</button><button id="augCatalog">카탈로그에 기록</button></div><p class="aug-hint">ZIP은 무압축 · 이미지와 manifest.json 포함. 다운로드 위치는 브라우저 설정을 따릅니다.</p></section></div></div><details class="aug-policy"><summary>처리 정책 · 재현성 · 알고리즘 근거</summary><p>순서: 투명도 배경 합성 → Brightness → Contrast (휘도 평균 기준) → Saturation (Rec.601 휘도) → Hue (HSV) → Grayscale → 좌우/상하 flip → Rotation → Resize → MixUp 또는 CutMix. A와 B는 각각 단일 이미지 변환을 거친 뒤 혼합합니다. Resize의 Keep는 지정 경계 안 최대 크기, Fit은 지정 크기와 배경 여백, Crop은 지정 크기 중앙 자르기입니다. 회전은 시계방향, bilinear canvas 보간입니다.</p><p>MixUp: λA+(1−λ)B. CutMix: 중심을 균등 추출하고 sqrt(1−λ) 비율의 사각 패치를 클립하여 붙입니다. 라벨 가중치는 1−(실제 패치 면적/최종 이미지 면적)로 계산합니다. 혼합이 마지막 단계이므로 이후 crop으로 가중치가 바뀌지 않습니다. 두 입력의 라벨이 모두 있어야 혼합 분류 라벨을 내보냅니다. 라벨 정확성과 증강 적합성은 사용자가 검토해야 합니다.</p><p>동일 파일 순서·설정·seed·동일 브라우저에서는 재현됩니다. 브라우저별 디코딩·색 관리·보간 차이는 있을 수 있습니다. 파일 이름과 선택 라벨, 설정, 실현된 변환, 짝 이름, 패치 좌표가 manifest에 포함됩니다. EXIF·ICC 메타데이터는 보존하지 않으며 출력은 canvas 디코딩 결과입니다. 애니메이션 입력은 정지 프레임만 처리합니다. 취소 시 이번 배치 결과는 버리고 이전 완료 결과를 보존합니다.</p><p><a href="https://docs.pytorch.org/vision/main/generated/torchvision.transforms.ColorJitter.html" target="_blank" rel="noopener">Torchvision ColorJitter</a> · <a href="https://arxiv.org/abs/1710.09412" target="_blank" rel="noopener">MixUp 논문</a> · <a href="https://arxiv.org/abs/1905.04899" target="_blank" rel="noopener">CutMix 논문</a>. 정의를 참고한 독립 canvas 구현이며 torchvision과 픽셀 단위 동일성을 주장하지 않습니다.</p></details><footer class="page-note">로컬 이미지 도구 · 샘플 카탈로그와 구분 · 외부 전송/서버 저장 없음</footer>`}
function augBind(){document.querySelectorAll('[data-cfg]').forEach(el=>el.onchange=()=>{if(el.checkValidity()){AUG.config[el.dataset.cfg]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;AUG.preview=null;augShowPreview()}});$('augFiles').onchange=e=>augLoad(e.target.files);$('augClear').onclick=augClear;$('augPreview').onclick=()=>augRun(false);$('augBatch').onclick=()=>augRun(true);$('augCancel').onclick=()=>{AUG.cancel=true;augStatus('취소 요청됨 · 현재 단계 종료 후 정리합니다.')};$('augZip').onclick=augSaveZip;$('augManifest').onclick=()=>AUG.outputs.length?augDownload(new Blob([JSON.stringify(augManifest(),null,2)],{type:'application/json'}),'atlas-manifest.json'):augStatus('먼저 전체 증강을 생성하세요.');$('augCatalog').onclick=augCatalog;}

function augClear(){if(AUG.busy)return;AUG.sources.forEach(s=>{s.canvas.width=1;s.canvas.height=1});AUG.sources=[];AUG.outputs=[];AUG.preview=null;AUG.selected=0;augSources();augResults();augShowPreview();augStatus('현재 입력과 결과를 비웠습니다. 원본 파일은 변경되지 않았습니다.')}

async function augMix(a,b,mode,lambda,rng){let c=augClone(a),ctx=c.getContext('2d'),patch=null,effective=lambda;if(mode==='mixup'){let ia=ctx.getImageData(0,0,c.width,c.height),ib=b.getContext('2d').getImageData(0,0,c.width,c.height);for(let i=0;i<ia.data.length;i+=4){for(let k=0;k<3;k++)ia.data[i+k]=lambda*ia.data[i+k]+(1-lambda)*ib.data[i+k];ia.data[i+3]=255;if(i%1048576===0)await augYield()}ctx.putImageData(ia,0,0)}else{let ratio=Math.sqrt(1-lambda),pw=Math.floor(c.width*ratio),ph=Math.floor(c.height*ratio),cx=Math.floor(rng()*c.width),cy=Math.floor(rng()*c.height),x1=Math.max(0,cx-Math.floor(pw/2)),y1=Math.max(0,cy-Math.floor(ph/2)),x2=Math.min(c.width,cx+Math.ceil(pw/2)),y2=Math.min(c.height,cy+Math.ceil(ph/2));patch={x:x1,y:y1,width:x2-x1,height:y2-y1};if(patch.width&&patch.height)ctx.drawImage(b,x1,y1,patch.width,patch.height,x1,y1,patch.width,patch.height);effective=1-patch.width*patch.height/(c.width*c.height)}return{canvas:c,effective,patch}}

function augResults(){if(!$('augResults'))return;$('augResults').innerHTML=AUG.outputs.length?AUG.outputs.map((o,i)=>`<div class="aug-result"><span>${esc(o.meta.output)}<br><span class="muted tiny">${esc(o.meta.source)}${o.meta.partner!==null?' + '+esc(o.meta.partner):''} · ${o.meta.outputDimensions.join(' × ')}</span></span><button onclick="augSaveOne(${i})">저장</button></div>`).join(''):'<p class="aug-hint">아직 생성한 결과가 없습니다.</p>'}
